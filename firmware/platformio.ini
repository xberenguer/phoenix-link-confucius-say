[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = partitions-offline.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
monitor_speed = 115200
extra_scripts = post:scripts/merge_firmware.py
build_unflags = -std=gnu++11
build_flags =
    -Wl,--wrap=esp_partition_erase_range
    -std=gnu++17
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5GFX@0.3.0
    https://github.com/m5stack/M5Unified.git#96576a14247ddc935149145aa6b51943464120f1
    https://github.com/m5stack/M5PM1.git#315d2899c863ae34b59197392b9f4c59490751ef
