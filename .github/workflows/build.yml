name: Build firmware and check reference
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check release documentation, media and source synchronization
        run: python3 tools/verify_release.py
      - name: Install pinned PlatformIO in an isolated environment
        run: |
          python3 -m venv /tmp/phoenix-pio
          /tmp/phoenix-pio/bin/python -m pip install platformio==6.1.19
      - name: Build firmware and offline assets
        working-directory: firmware
        run: |
          /tmp/phoenix-pio/bin/pio run -e m5stack-sticks3
          python3 scripts/build_assets.py
      - name: Check implemented payout documentation
        run: |
          c++ -std=c++17 -O2 -Ifirmware/src tools/export_wiki_tables.cpp -o /tmp/phoenix-export
          /tmp/phoenix-export /tmp/phoenix-reference
          diff docs/data/implemented-line-pays.csv /tmp/phoenix-reference/implemented-line-pays.csv
          diff docs/data/implemented-paylines.csv /tmp/phoenix-reference/implemented-paylines.csv
          diff docs/data/offered-wagers.csv /tmp/phoenix-reference/offered-wagers.csv
      - name: Check CSPRNG known answers and failed-action atomicity
        run: python3 tools/test_rng.py --sanitize
      - name: Verify browser source and bundle provenance
        run: python3 browser/verify_bundle.py --source firmware/src --assets firmware/data --bundle demo
